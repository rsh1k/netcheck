[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netcheck-ir"
dynamic = ["version"]
description = "Enterprise network triage, security posture, and IR/forensics in one command - environment-aware (WSL2/VM/cloud), with optional AI analysis (Claude / OpenAI / Azure / Ollama)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["network", "diagnostics", "troubleshooting", "security", "incident-response",
            "forensics", "dfir", "ai", "llm", "dns", "tls", "ssh", "waf", "cloud", "nist",
            "aws", "gcp", "azure", "wsl", "sysadmin", "devops", "cli"]
authors = [{ name = "NetCheck contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
toml = ["tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/rsh1k/netcheck"
Issues = "https://github.com/rsh1k/netcheck/issues"

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.setuptools]
packages = ["netcheck"]

[tool.setuptools.dynamic]
version = { attr = "netcheck.__version__" }
