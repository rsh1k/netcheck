[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netcheck-cli"
version = "2.0.0"
description = "Enterprise network triage, security posture, and IR/forensics in one command - with optional AI analysis (Claude / OpenAI / Azure / Ollama)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["network", "diagnostics", "troubleshooting", "security", "incident-response",
            "forensics", "dfir", "ai", "llm", "dns", "tls", "sysadmin", "devops", "cli"]
authors = [{ name = "NetCheck contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
# Zero runtime dependencies - standard library only (AI calls use urllib, no SDKs).
dependencies = []

[project.optional-dependencies]
# Only needed for TOML config files on Python < 3.11 (JSON config works everywhere).
toml = ["tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/your-username/netcheck"
Issues = "https://github.com/your-username/netcheck/issues"

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.setuptools]
packages = ["netcheck"]
